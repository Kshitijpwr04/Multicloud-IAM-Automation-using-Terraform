name: policy-ci

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "policy/**"
      - "scripts/**"

jobs:
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conftest
        run: |
          wget -qO- https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_0.54.0_Linux_x86_64.tar.gz | tar -xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Policy checks (sandbox)
        run: |
          bash ../../scripts/run_policy_checks.sh sandbox
        env:
          TF_VAR_enable_aws: "false"
          TF_VAR_enable_gcp: "false"